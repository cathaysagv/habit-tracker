<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/app.js" defer></script>
</head>
<body>
    <header>
        <p class="date">Viernes, 16 de octubre</p>
        <h1>Hoy</h1>
    </header>

    <main>
        <section class="progress">

            <div class="progress-info">
                <p class="progress-text">2 de 4 hábitos hechos</p>
                <p class="progress-percent">50%</p>
            </div>

            <div class="progress-bar" aria-hidden="true">
                <div class="progress-fill"></div>
            </div>

        </section>

        <form class="habit-form" hidden>
            <h2>Nuevo hábito</h2>
            <label for="habit-name-input">Nombre del hábito</label>
            <input type="text" id="habit-name-input" name="name" required maxlength="40" placeholder="Ej.: Meditar 10 minutos">
            <fieldset>
                <legend>Color</legend>
                <input type="radio" name="color" value="#6D4AE0" aria-label="Violeta" checked>
                <input type="radio" name="color" value="#2B7FD9" aria-label="Azul">
                <input type="radio" name="color" value="#1F9E89" aria-label="Verde azulado">
                <input type="radio" name="color" value="#D9467A" aria-label="Rosa">
                <input type="radio" name="color" value="#E08A00" aria-label="Ámbar">                            
            </fieldset>
            
            <div class="form-actions">
                <button type="button" class="btn-cancel">Cancelar</button>
                <button type="submit" class="btn-save">Guardar hábito</button>
            </div>            
        </form>

        <section class="habits">
            <h2>Tus hábitos</h2>

            <ul class="habit-list">
                <li class="habit-card">

                    <div class="habit-main">
                        <span class="habit-color" aria-hidden="true"></span>
                        <div class="habit-info">
                            <h3 class="habit-name">Leer 20 minutos</h3>
                            <p class="habit-streak">Racha de 12 días</p>
                        </div>
                        
                        <button type="button" class="habit-check" aria-label="Marcar Leer 20 minutos como hecho"></button>
                    </div>

                    <ol class="habit-week" aria-hidden="true">
                        <li class="day done">
                            <span class="day-label">L</span>
                            <span class="day-mark"></span>
                        </li>
                        
                        <li class="day done">
                            <span class="day-label">M</span>
                            <span class="day-mark"></span>
                        </li>

                        <li class="day done">
                            <span class="day-label">X</span>
                            <span class="day-mark"></span>
                        </li>

                        <li class="day done">
                            <span class="day-label">J</span>
                            <span class="day-mark"></span>
                        </li>

                        <li class="day pending today">
                            <span class="day-label">V</span>
                            <span class="day-mark"></span>
                        </li>

                        <li class="day pending">
                            <span class="day-label">S</span>
                            <span class="day-mark"></span>
                        </li>

                        <li class="day pending">
                            <span class="day-label">D</span>
                            <span class="day-mark"></span>
                        </li>
                    </ol>

                </li>
            </ul>
        </section>

        <button type="button" class="new-habit-btn">Nuevo hábito</button>
       
    </main>
    
    
</body>
</html>
